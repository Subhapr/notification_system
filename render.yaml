# Render Blueprint - optional convenience file.
# You can also configure the service manually in the Render dashboard;
# see docs/DEPLOYMENT.md for the manual steps.
services:
  - type: web
    name: notification-system-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    rootDir: backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: notification-system-db
          property: connectionString
      - key: EMAIL_PROVIDER
        value: "postmark"
      - key: SITE_NAME
        value: "NotifyHub"
databases:
  - name: notification-system-db
    plan: free
